<style>
    :root {
      --paper:#f7f3ed;
      --paper2:#fbf8f3;
      --burgundy:#955c6a;
      --burgundy-dark:#7d4b58;
      --olive:#70715c;
      --olive-soft:#8f8e7a;
      --line:rgba(149,92,106,.22);
      --shadow:0 20px 58px rgba(76,57,48,.12);
      --radius:25px;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      overflow-x:hidden;
      color:var(--olive);
      background:
        radial-gradient(circle at 12% 4%, rgba(255,255,255,.92), transparent 27%),
        radial-gradient(circle at 84% 92%, rgba(149,92,106,.05), transparent 30%),
        var(--paper);
      font-family:"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .shell {
      width:min(100%,560px);
      margin:0 auto;
      padding:12px 12px 42px;
    }

    .panel {
      position:relative;
      overflow:hidden;
      border:1px solid rgba(149,92,106,.12);
      border-radius:var(--radius);
      background:rgba(255,253,249,.78);
      box-shadow:var(--shadow);
    }

    /* ---------- OPENING CARD ---------- */
    .opening-stage {
      position:relative;
      aspect-ratio:1429 / 2000;
      perspective:1800px;
      transform-style:preserve-3d;
      background:var(--paper2);
      isolation:isolate;
    }

    .inside-under {
      position:absolute;
      inset:0;
      z-index:1;
      overflow:hidden;
      border-radius:inherit;
      background:var(--paper2);
    }

    .inside-under img,
    .front-cover img {
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }

    .inside-under::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:inset 18px 0 28px rgba(69,47,49,.09);
    }

    .front-cover {
      position:absolute;
      inset:0;
      z-index:4;
      transform-origin:right center;
      transform-style:preserve-3d;
      backface-visibility:hidden;
      will-change:transform,filter;
      transition:
        transform 2.15s cubic-bezier(.22,.72,.16,1),
        filter 1.35s ease;
    }

    .front-cover::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(270deg,
        rgba(77,49,56,.16) 0%,
        rgba(255,255,255,.08) 8%,
        transparent 23%);
      opacity:0;
      transition:opacity .48s ease;
    }

    .opening-stage.open .front-cover {
      transform:rotateY(112deg);
      filter:drop-shadow(-18px 14px 18px rgba(65,45,49,.16));
    }

    .opening-stage.open .front-cover::after { opacity:1; }

    .open-area {
      position:absolute;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:27%;
      z-index:5;
      pointer-events:none;
      transition:opacity .28s ease;
    }

    .opening-stage.open .open-area { opacity:0; }

    .open-btn {
      pointer-events:auto;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(149,92,106,.30);
      background:rgba(250,247,242,.84);
      color:var(--burgundy-dark);
      border-radius:999px;
      padding:12px 25px 13px;
      font:inherit;
      font-weight:700;
      letter-spacing:.01em;
      box-shadow:0 11px 28px rgba(91,63,67,.12);
      backdrop-filter:blur(7px);
      cursor:pointer;
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .open-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 14px 32px rgba(91,63,67,.16);
    }

    .open-btn::after {
      content:"";
      position:absolute;
      top:-95%;
      left:-38%;
      width:23%;
      height:290%;
      transform:rotate(20deg);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.82),transparent);
      animation:buttonShimmer 5.7s ease-in-out infinite;
    }

    @keyframes buttonShimmer {
      0%,72% { left:-38%; opacity:0; }
      78% { opacity:.65; }
      89% { left:125%; opacity:.15; }
      100% { left:125%; opacity:0; }
    }

    .opened-note {
      position:absolute;
      left:0; right:0; bottom:17px;
      z-index:2;
      text-align:center;
      color:rgba(125,75,88,.78);
      font-size:.82rem;
      opacity:0;
      transform:translateY(7px);
      transition:opacity .6s 1.4s ease, transform .6s 1.4s ease;
      pointer-events:none;
    }

    .opening-stage.open .opened-note {
      opacity:1;
      transform:none;
    }

    /* ---------- CONTENT ---------- */
    .main-content {
      opacity:0;
      transform:translateY(22px);
      transition:opacity .8s ease, transform .8s ease;
    }

    .main-content.visible {
      opacity:1;
      transform:none;
    }

    .hero-copy {
      text-align:center;
      padding:36px 22px 27px;
    }

    .kicker {
      margin-bottom:9px;
      color:var(--olive-soft);
      font-size:.9rem;
      letter-spacing:.13em;
    }

    h1 {
      margin:0;
      color:var(--burgundy);
      font-size:clamp(2.1rem,8vw,3.15rem);
      line-height:1.05;
    }

    .sub { margin-top:11px; font-size:1rem; }

    .invite-img {
      width:100%;
      height:auto;
      display:block;
    }

    .details {
      margin-top:18px;
      padding:28px 20px;
      text-align:center;
      background:linear-gradient(180deg,rgba(255,255,255,.60),rgba(255,255,255,.34));
    }

    .date { color:var(--burgundy-dark); font-size:1.1rem; font-weight:700; }
    .venue { margin-top:8px; }
    .times { margin-top:8px; }
    .hairline { width:62px; height:1px; margin:20px auto; background:var(--line); }
    .count-title { margin-bottom:14px; font-size:1rem; }

    .countdown {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .count {
      padding:14px 4px 12px;
      border:1px solid var(--line);
      border-radius:17px;
      background:rgba(255,255,255,.49);
    }

    .count b {
      display:block;
      color:var(--burgundy);
      font-size:1.52rem;
      line-height:1;
    }

    .count span {
      display:block;
      margin-top:7px;
      font-size:.76rem;
    }

    .actions {
      display:grid;
      gap:11px;
      margin-top:22px;
    }

    .btn {
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:50px;
      padding:13px 18px;
      border-radius:15px;
      text-decoration:none;
      font-weight:700;
      transition:.2s ease;
    }

    .btn.primary {
      color:#fff;
      background:var(--burgundy);
      box-shadow:0 10px 24px rgba(149,92,106,.18);
    }

    .btn.primary:hover {
      background:var(--burgundy-dark);
      transform:translateY(-1px);
    }

    .btn.secondary {
      color:var(--burgundy-dark);
      border:1px solid rgba(149,92,106,.34);
      background:rgba(255,255,255,.32);
    }

    .closing {
      padding:28px 20px 5px;
      text-align:center;
      font-size:.95rem;
    }

    .small { margin-top:5px; font-size:.78rem; opacity:.7; }

    /* ---------- REVEALS ---------- */
    .reveal-item {
      opacity:0;
      transform:translateY(20px) scale(.993);
      filter:blur(3px);
      transition:
        opacity .78s ease,
        transform .78s cubic-bezier(.2,.72,.18,1),
        filter .78s ease;
    }

    .reveal-item.in {
      opacity:1;
      transform:none;
      filter:none;
    }

    
    
    @media (max-width:420px) {
      .shell { padding:9px 9px 30px; }
      .panel { border-radius:21px; }
      .open-area { padding-top:25.5%; }
      .open-btn { padding:11px 21px 12px; }
      .countdown { gap:6px; }
      .count { border-radius:14px; }
    }

    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      .front-cover, .main-content, .reveal-item { transition:none!important; }
      .open-btn::after { animation:none!important; }
    }
  </style>
</head>

<body>
<main class="shell">
    <section class="panel opening-stage" id="openingStage">
      <div class="inside-under">
        <img src="invitation.jpg" alt="">
      </div>

      <div class="front-cover" id="frontCover">
        <img src="cover.jpg" alt="הזמנת החתונה של יענקי ורחלי — כריכה">
        <div class="open-area">
          <button class="open-btn" id="openBtn" type="button">לפתיחת ההזמנה</button>
        </div>
      </div>

      <div class="opened-note">ההזמנה נפתחה ✦</div>
    </section>

    <section class="main-content" id="mainContent">
      <div class="hero-copy reveal-item">
        <div class="kicker">בסימן טוב ובמזל טוב</div>
        <h1>יענקי &amp; רחלי</h1>
        <div class="sub">נשמח לראותכם משתתפים בשמחתנו</div>
      </div>

      <section class="panel reveal-item">
        <img class="invite-img" src="invitation.jpg" alt="הזמנת החתונה המלאה">
      </section>

      <section class="panel details reveal-item">
        <div class="date">יום ראשון · ז׳ חשוון תשפ״ז · 18.10.2026</div>
        <div class="venue">אולם גני הדקל · עזרא 22 · בני ברק</div>
        <div class="times">קבלת פנים 18:00 · חופה 18:30</div>

        <div class="hairline"></div>

        <div class="count-title">סופרים לשמחה</div>
        <div class="countdown" aria-label="ספירה לאחור לחתונה">
          <div class="count"><b id="days">0</b><span>ימים</span></div>
          <div class="count"><b id="hours">0</b><span>שעות</span></div>
          <div class="count"><b id="minutes">0</b><span>דקות</span></div>
          <div class="count"><b id="seconds">0</b><span>שניות</span></div>
        </div>

        <div class="actions">
          <a class="btn primary"
             href="https://www.waze.com/he/live-map/directions/%D7%90%D7%95%D7%9C%D7%9D-%D7%92%D7%A0%D7%99-%D7%94%D7%93%D7%A7%D7%9C-%D7%95%D7%94%D7%AA%D7%9E%D7%A8-%D7%A2%D7%96%D7%A8%D7%90-20-%D7%91%D7%A0%D7%99-%D7%91%D7%A8%D7%A7?to=place.w.22806849.228330632.145199"
             target="_blank" rel="noopener noreferrer">ניווט ב־Waze</a>

          <a class="btn secondary"
             href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=%D7%97%D7%AA%D7%95%D7%A0%D7%AA%20%D7%99%D7%A2%D7%A0%D7%A7%D7%99%20%D7%95%D7%A8%D7%97%D7%9C%D7%99&dates=20261018T150000Z%2F20261018T200000Z&details=%D7%A7%D7%91%D7%9C%D7%AA%20%D7%A4%D7%A0%D7%99%D7%9D%2018%3A00%20%C2%B7%20%D7%97%D7%95%D7%A4%D7%94%2018%3A30&location=%D7%90%D7%95%D7%9C%D7%9D%20%D7%92%D7%A0%D7%99%20%D7%94%D7%93%D7%A7%D7%9C%2C%20%D7%A2%D7%96%D7%A8%D7%90%2022%2C%20%D7%91%D7%A0%D7%99%20%D7%91%D7%A8%D7%A7"
             target="_blank" rel="noopener noreferrer">הוספה ליומן Google</a>
        </div>
      </section>

      <div class="closing reveal-item">
        בשמחות ובמזל טוב
        <div class="small">יענקי &amp; רחלי</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const stage = document.getElementById("openingStage");
      const openBtn = document.getElementById("openBtn");
      const mainContent = document.getElementById("mainContent");

      let opened = false;

      function revealVisibleItems() {
        document.querySelectorAll(".reveal-item").forEach((el) => {
          const r = el.getBoundingClientRect();
          if (r.top < window.innerHeight * .9) el.classList.add("in");
        });
      }

      openBtn.addEventListener("click", () => {
        if (opened) return;
        opened = true;

        stage.classList.add("open");

        setTimeout(() => {
          mainContent.classList.add("visible");
        }, 1050);

        setTimeout(() => {
          mainContent.scrollIntoView({ behavior:"smooth", block:"start" });
          revealVisibleItems();
        }, 2450);
      });

      window.addEventListener("scroll", revealVisibleItems, { passive:true });
      window.addEventListener("resize", revealVisibleItems);

      const wedding = new Date("2026-10-18T18:30:00+03:00").getTime();

      function updateCountdown() {
        const diff = Math.max(0, wedding - Date.now());
        const day = 86400000;
        const hour = 3600000;
        const minute = 60000;

        document.getElementById("days").textContent = Math.floor(diff / day);
        document.getElementById("hours").textContent = Math.floor((diff % day) / hour);
        document.getElementById("minutes").textContent = Math.floor((diff % hour) / minute);
        document.getElementById("seconds").textContent = Math.floor((diff % minute) / 1000);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
